<svg width="900" height="390" viewBox="0 0 900 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mechatronics skills: PLC programming, CAD design, 3D printing, robotics and PCB design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="900" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B222C"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1" y="1" width="898" height="388" rx="14"/>
    </clipPath>
    <style>
      .cursor { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="388" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="900" height="44" fill="url(#bar)"/>
    <line x1="1" y1="44" x2="899" y2="44" stroke="#30363D"/>
    <line x1="1" y1="45" x2="899" y2="45" stroke="#0A0D12" opacity=".6"/>
    <circle cx="24" cy="22" r="6.5" fill="#FF5F57"/>
    <circle cx="48" cy="22" r="6.5" fill="#FEBC2E"/>
    <circle cx="72" cy="22" r="6.5" fill="#28C840"/>
    <text x="450" y="27" text-anchor="middle" fill="#7D8590" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12">carlos@github: ~/mechatronics — zsh</text>

    <text x="32" y="83" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13">
      <tspan fill="#3FB950">$</tspan><tspan fill="#7D8590" dx="8">mechatronics --skills</tspan>
    </text>
    <text x="32" y="124" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-.4">Hardware, control &amp; physical systems</text>

    <line x1="450" y1="151" x2="450" y2="315" stroke="#30363D"/>
    <line x1="32" y1="231" x2="868" y2="231" stroke="#30363D"/>

    <text x="32" y="174" fill="#58A6FF" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" letter-spacing=".5">CONTROL &amp; AUTOMATION</text>
    <text x="32" y="202" fill="#C9D1D9" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14">PLC programming · control logic</text>

    <text x="486" y="174" fill="#58A6FF" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" letter-spacing=".5">MECHANICAL DESIGN</text>
    <text x="486" y="202" fill="#C9D1D9" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14">CAD modeling · 3D printing</text>

    <text x="32" y="267" fill="#58A6FF" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" letter-spacing=".5">ROBOTICS</text>
    <text x="32" y="295" fill="#C9D1D9" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14">Robotic systems</text>

    <text x="486" y="267" fill="#58A6FF" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" letter-spacing=".5">ELECTRONICS / PCB DESIGN</text>
    <text x="486" y="295" fill="#C9D1D9" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14">Printed circuit board design &amp; layout</text>

    <text x="32" y="354" fill="#3FB950" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13">$</text>
    <rect x="52" y="343" width="9" height="13" rx="1" fill="#3FB950" class="cursor"/>
  </g>
  <rect x="1" y="1" width="898" height="388" rx="14" stroke="#30363D"/>
